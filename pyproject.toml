[project]
name = "pokerdf"
version = "1.8.0"
description = "Converts poker hand history files to pandas DataFrames."
readme = "README.md"
authors = [{ name = "Murilo Amaral", email = "murilogmamaral@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11.5"
keywords = [
    "poker",
    "pokerstars",
    "hand-history",
    "data-analysis",
    "data-engineering",
    "analytics",
    "pandas",
    "parquet",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "joblib==1.3.2",
    "pandas>=2.0.0",
    "pyarrow>=16.1.0",
    "pydantic>=2.8.0",
]

[project.scripts]
pokerdf = "pokerdf.main:main"

[project.urls]
Homepage = "https://github.com/murilogmamaral/pokerdf"
Repository = "https://github.com/murilogmamaral/pokerdf"
Issues = "https://github.com/murilogmamaral/pokerdf/issues"
Changelog = "https://github.com/murilogmamaral/pokerdf/releases"

[dependency-groups]
dev = [
    "black>=24.4.2",
    "flake8>=7.0.0",
    "flake8-pyproject>=1.2.3",
    "mypy>=1.0.0",
    "pytest>=7.0.1",
    "ruff>=0.4.0",
]

[tool.uv]
# The output schema and the expected artifacts in tests/ were validated with
# pandas 2.x (pandas 3 changed the default string dtype on read_parquet).
# This constrains the local/CI environment only; the published package
# metadata keeps the ranges declared in [project.dependencies].
constraint-dependencies = ["pandas<3.0.0"]

[build-system]
# 1.27 is the first release that understands the SPDX license expression
# declared above (PEP 639): older versions silently fall back to the legacy
# metadata field, hiding the license from the PyPI page
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pokerdf"]

[tool.hatch.build.targets.sdist]
# Ship only what is needed to build and install the package: keeps test
# fixtures (hand histories) and images out of the PyPI source distribution
include = ["pokerdf", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
# A warning is a regression that has not happened yet: the suite fails on
# any of them, so new ones cannot pile up unnoticed. Ignores must be
# targeted at a specific message and justified
filterwarnings = [
    "error",
    # Raised inside pandas 2.x internals by numpy 2.x (Python 3.12+ resolves
    # a newer numpy): not actionable from this codebase
    "ignore:The 'generic' unit for NumPy timedelta:DeprecationWarning",
    # Raised inside joblib 1.3.2 on Python 3.12+ (ast.Num and its .n
    # attribute). Both disappear in Python 3.14, so supporting 3.14 will
    # require raising the joblib pin
    "ignore:(ast.Num is|Attribute n is) deprecated:DeprecationWarning",
]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["venv", ".venv", "build"]

[tool.ruff.lint]
# Pin the classic default rule set, so newer ruff releases with broader
# defaults do not start flagging existing code
select = ["E4", "E7", "E9", "F"]

[tool.black]
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = true
