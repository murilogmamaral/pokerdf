# Deploys the package to https://pypi.org/project/pokerdf/
#
# Trigger it manually via "Run workflow" (workflow_dispatch) in the Actions tab,
# choosing the semver level to bump (patch by default). No manual version bump
# is needed: the version in pyproject.toml always reflects the latest published
# release, and this pipeline infers the next one from the chosen level.
#
# Full pipeline:
#   1. test            -> run the test suite; nothing happens if it fails
#   2. bump-and-build  -> bump the version with uv, commit the bump back to
#                         main, then build sdist/wheel
#   3. github-release  -> create the git tag and the GitHub release dynamically,
#                         named "v{version}", with the distributions attached
#   4. pypi-publish    -> upload the distributions to PyPI (Trusted Publishing)

name: Upload Python Package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver level to bump (patch: 1.0.6 -> 1.0.7)"
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

# Never allow two deploys running at the same time
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run python -m pytest tests/ -q

  bump-and-build:
    runs-on: ubuntu-latest
    needs:
      - test
    permissions:
      # Required to push the version bump commit to main
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.push.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Bump version in pyproject.toml
        id: bump
        run: |
          uv version --bump "${{ inputs.bump }}"
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Commit and push the bump to main
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "bump version to ${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build release distributions with uv
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  github-release:
    runs-on: ubuntu-latest
    needs:
      - bump-and-build
    permissions:
      # Required to push the tag and create the release
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, required to build the release notes
          fetch-depth: 0

      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.bump-and-build.outputs.version }}
          TARGET_SHA: ${{ needs.bump-and-build.outputs.sha }}
        run: |
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Check the version in pyproject.toml."
            exit 1
          fi

          # Release notes: one bullet per commit since the last tag.
          # The commits are the source of the notes because changes land on
          # main directly (GitHub's --generate-notes only lists pull requests,
          # but still appends the "Full Changelog" comparison link).
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then RANGE="$LAST_TAG..$TARGET_SHA"; else RANGE="$TARGET_SHA"; fi
          {
            echo "## Changes"
            git log "$RANGE" --no-merges --pretty="- %s (%h)" | grep -v "^- bump version to" || true
          } > notes.md

          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --generate-notes --target "$TARGET_SHA"

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - github-release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    environment:
      name: pypi
      url: https://pypi.org/project/pokerdf/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
