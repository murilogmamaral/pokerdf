# Deploys the package to https://pypi.org/project/pokerdf/
#
# Trigger it manually via "Run workflow" (workflow_dispatch) in the Actions tab.
# No manual version bump is needed: the version in pyproject.toml always
# reflects the latest published release, and the semver level of the next one
# is inferred ("auto", the default) from the Conventional Commit titles that
# landed on main since the last tag - CI enforces the format on every pull
# request, and the squash commit takes the title of the pull request:
#   type!: (or a BREAKING CHANGE footer)  -> major
#   feat:                                 -> minor
#   fix:, docs:, refactor:, and the rest  -> patch
# A title the inference cannot read fails the run: guessing could hide a
# feature or a breaking change inside a patch release. Choosing an explicit
# level overrides the inference, both for those cases and for releases whose
# semantics live in the data rather than in the commit titles.
#
# Full pipeline:
#   1. test            -> run the test suite; nothing happens if it fails
#   2. plan            -> infer or take the level and compute the exact
#                         version about to be released, without side effects
#   3. approve         -> pause until the plan is approved in the Actions UI
#                         (required reviewers of the release-approval
#                         environment); nothing is bumped, tagged or
#                         published before the approval
#   4. bump-and-build  -> bump the version with uv, commit the bump back to
#                         main, then build sdist/wheel
#   5. github-release  -> create the git tag and the GitHub release dynamically,
#                         named "v{version}", with the distributions attached
#   6. pypi-publish    -> upload the distributions to PyPI (Trusted Publishing)

name: Upload Python Package

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver level (auto: inferred from the commit titles)"
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: read

# Never allow two deploys running at the same time
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run python -m pytest tests/ -q

  plan:
    runs-on: ubuntu-latest
    needs:
      - test
    outputs:
      level: ${{ steps.level.outputs.level }}
      current: ${{ steps.next.outputs.current }}
      next: ${{ steps.next.outputs.next }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, required to inspect the commits since
          # the last release when inferring the semver level
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Determine the semver level
        id: level
        run: |
          if [ "${{ inputs.bump }}" != "auto" ]; then
            echo "Level chosen manually: ${{ inputs.bump }}"
            echo "level=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then RANGE="$LAST_TAG..HEAD"; else RANGE="HEAD"; fi

          # One subject per commit since the last release, without the bump
          # commits of previous deploys
          SUBJECTS=$(git log "$RANGE" --no-merges --pretty="%s" | grep -v "^bump version to" || true)
          if [ -z "$SUBJECTS" ]; then
            echo "::error::No commits since ${LAST_TAG:-the first commit}: nothing to release."
            exit 1
          fi
          echo "Commits since ${LAST_TAG:-the first commit}:"
          echo "$SUBJECTS"

          # Every title must be readable by the inference: a title outside
          # the convention could hide a feature - or a breaking change -
          # inside a patch release. Choosing the level manually in the
          # dispatch input is the escape hatch for those releases
          INVALID=$(echo "$SUBJECTS" | grep -vE "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]*\))?!?: .+" || true)
          if [ -n "$INVALID" ]; then
            echo "::error::Cannot infer the level: the titles below do not follow Conventional Commits. Fix them or re-run the workflow choosing patch, minor or major explicitly."
            echo "$INVALID"
            exit 1
          fi

          # Highest level found wins: breaking marker, then feat, then patch.
          # The breaking-change marker is only read from a footer line, as
          # the specification defines it: matching the phrase anywhere in a
          # body once inferred a major from a commit that merely described
          # this convention
          BODIES=$(git log "$RANGE" --no-merges --pretty="%B")
          LEVEL=patch
          if echo "$SUBJECTS" | grep -qE "^[a-z]+(\([^)]*\))?!:" || echo "$BODIES" | grep -qE "^BREAKING[ -]CHANGE:"; then
            LEVEL=major
          elif echo "$SUBJECTS" | grep -qE "^feat(\([^)]*\))?:"; then
            LEVEL=minor
          fi
          echo "Inferred level: $LEVEL"
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      - name: Compute the version about to be released
        id: next
        run: |
          CURRENT=$(uv version --short)
          NEXT=$(uv version --bump "${{ steps.level.outputs.level }}" --dry-run --short)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          {
            echo "## Release plan"
            echo ""
            echo "| Current | Level | Next |"
            echo "|---------|-------|------|"
            echo "| $CURRENT | ${{ steps.level.outputs.level }} | **$NEXT** |"
          } >> "$GITHUB_STEP_SUMMARY"

  approve:
    # Pauses the run until a required reviewer of the release-approval
    # environment approves it in the Actions UI. The summary of the plan
    # job shows the exact version about to be released, and nothing is
    # bumped, tagged or published before the approval
    runs-on: ubuntu-latest
    needs:
      - plan
    environment: release-approval

    steps:
      - name: Confirm the approved plan
        run: |
          echo "Approved release: ${{ needs.plan.outputs.current }} -> ${{ needs.plan.outputs.next }} (${{ needs.plan.outputs.level }})"

  bump-and-build:
    runs-on: ubuntu-latest
    needs:
      - plan
      - approve
    permissions:
      # Required to push the version bump commit to main
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.push.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"

      - name: Bump version in pyproject.toml
        id: bump
        run: |
          uv version --bump "${{ needs.plan.outputs.level }}"
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Commit and push the bump to main
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "bump version to ${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build release distributions with uv
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  github-release:
    runs-on: ubuntu-latest
    needs:
      - bump-and-build
    permissions:
      # Required to push the tag and create the release
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags, required to build the release notes
          fetch-depth: 0

      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.bump-and-build.outputs.version }}
          TARGET_SHA: ${{ needs.bump-and-build.outputs.sha }}
        run: |
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Check the version in pyproject.toml."
            exit 1
          fi

          # Release notes: one bullet per commit since the last tag.
          # The commits are the source of the notes because changes land on
          # main directly (GitHub's --generate-notes only lists pull requests,
          # but still appends the "Full Changelog" comparison link).
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then RANGE="$LAST_TAG..$TARGET_SHA"; else RANGE="$TARGET_SHA"; fi
          {
            echo "## Changes"
            git log "$RANGE" --no-merges --pretty="- %s (%h)" | grep -v "^- bump version to" || true
          } > notes.md

          gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --generate-notes --target "$TARGET_SHA"

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - github-release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    environment:
      name: pypi
      url: https://pypi.org/project/pokerdf/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
