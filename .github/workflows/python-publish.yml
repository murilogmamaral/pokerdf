# Deploys the package to https://pypi.org/project/pokerdf/
#
# Trigger it manually via "Run workflow" (workflow_dispatch) in the Actions tab.
#
# Full pipeline:
#   1. test            -> run the test suite; nothing happens if it fails
#   2. release-build   -> build sdist/wheel and read the version from pyproject.toml
#   3. github-release  -> create the git tag and the GitHub release dynamically,
#                         named "v{version}", with the distributions attached
#   4. pypi-publish    -> upload the distributions to PyPI (Trusted Publishing)
#
# The tag is never hardcoded: it always comes from the version in pyproject.toml.
# If the tag already exists, the deploy fails early asking for a version bump.

name: Upload Python Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install

      - name: Run tests
        run: poetry run python -m pytest tests/ -q

  release-build:
    runs-on: ubuntu-latest
    needs:
      - test
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Poetry
        run: pip install poetry

      - name: Read package version from pyproject.toml
        id: version
        run: echo "version=$(poetry version --short)" >> "$GITHUB_OUTPUT"

      - name: Build release distributions with Poetry
        run: poetry build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  github-release:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      # Required to push the tag and create the release
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.release-build.outputs.version }}
        run: |
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists. Bump the version in pyproject.toml before deploying."
            exit 1
          fi
          gh release create "$TAG" dist/* --title "$TAG" --generate-notes --target "$GITHUB_SHA"

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - github-release
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    environment:
      name: pypi
      url: https://pypi.org/project/pokerdf/

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
