# Continuous integration: guarantees that unit tests and lint checks pass
# on every commit to main and on every pull request targeting main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The squash commit that lands on main takes the title of the pull request,
  # and the release pipeline infers the semver bump from those titles
  # (feat -> minor, type! -> major, anything else -> patch), so the
  # Conventional Commits format is mandatory
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check the title against Conventional Commits
        env:
          # Passed through the environment: a title interpolated into the
          # script would be a shell injection vector
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR title: $TITLE"
          if echo "$TITLE" | grep -qE '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-zA-Z0-9._/-]+\))?!?: .+'; then
            echo "Valid Conventional Commit title."
          else
            echo "::error::The pull request title must follow Conventional Commits: 'type(scope)?: description', e.g. 'feat: add a --gdpr option' or 'fix(convert): dedupe repeated hands'. Accepted types: build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test. Append '!' to the type for breaking changes."
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Check formatting with black
        run: uv run black --check pokerdf/ tests/

      - name: Lint with flake8
        run: uv run flake8 pokerdf/ tests/

      - name: Lint with ruff
        run: uv run ruff check pokerdf/ tests/

      - name: Type-check with mypy
        run: uv run mypy pokerdf/ tests/

  test:
    # Every Python version declared in the classifiers of pyproject.toml is
    # tested here, so the supported range is proven and not just claimed
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --python overrides the version pinned in .python-version,
      # which would otherwise force every job to run on 3.11
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} python -m pytest tests/ -q
