# Continuous integration: guarantees that unit tests and lint checks pass
# on every commit to main and on every pull request targeting main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Check formatting with black
        run: uv run black --check pokerdf/ tests/

      - name: Lint with flake8
        run: uv run flake8 pokerdf/ tests/

      - name: Lint with ruff
        run: uv run ruff check pokerdf/ tests/

      - name: Type-check with mypy
        run: uv run mypy pokerdf/ tests/

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run python -m pytest tests/ -q
