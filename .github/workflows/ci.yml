# Continuous integration: guarantees that unit tests and lint checks pass
# on every commit to main and on every pull request targeting main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Conventional Commit titles are enforced by the dedicated workflow in
  # conventional-commits.yml, on pull requests (including title edits) and
  # on every push to main
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Check formatting with black
        run: uv run black --check pokerdf/ tests/

      - name: Lint with flake8
        run: uv run flake8 pokerdf/ tests/

      - name: Lint with ruff
        run: uv run ruff check pokerdf/ tests/

      - name: Type-check with mypy
        run: uv run mypy pokerdf/ tests/

  test:
    # Every Python version declared in the classifiers of pyproject.toml is
    # tested here, so the supported range is proven and not just claimed
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # --python overrides the version pinned in .python-version,
      # which would otherwise force every job to run on 3.11
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} python -m pytest tests/ -q
